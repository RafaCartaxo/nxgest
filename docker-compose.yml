services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - DB_PATH=/data/gestao.db
      - JWT_SECRET=dev-secret-do-not-use-in-production
      - ADMIN_DEFAULT_PASSWORD=admin123
    volumes:
      - nexus_data:/data

volumes:
  nexus_data:
