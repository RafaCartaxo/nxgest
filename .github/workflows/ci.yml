name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tsc · build · audits · unit/UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: node scripts/check-dist.mjs
      - run: npm run audit:ui 2>&1 | tee /tmp/audit-ui.log
      - run: npm run audit:styles 2>&1 | tee /tmp/audit-styles.log
      - run: npm run audit:modules 2>&1 | tee /tmp/audit-modules.log
      - run: npm test 2>&1 | tee /tmp/test.log
      - run: npm run test:coverage 2>&1 | tee /tmp/coverage.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14
      - run: npm run docs:audit 2>&1 | tee /tmp/docs-audit.log
      - name: Resumo do run (job summary)
        if: always()
        run: |
          TESTS="n/d"; FILES="?"
          if grep -q "Tests" /tmp/test.log; then
            FILES=$(grep -oP '\d+(?= passed)' /tmp/test.log | head -1)
            TESTS=$(grep -oP '\d+(?= passed)' /tmp/test.log | tail -1)
          fi
          STMTS="n/d"
          if grep -q "All files" /tmp/coverage.log; then
            STMTS=$(grep "All files" /tmp/coverage.log | awk -F'|' '{gsub(/ /,"",$2); print $2}')
          fi
          ui=$(grep -q "nenhum padrão" /tmp/audit-ui.log && echo "PASS" || echo "FAIL")
          styles=$(grep -q "nenhuma cor fixa" /tmp/audit-styles.log && echo "PASS" || echo "FAIL")
          modules=$(grep -q "manifest coerente" /tmp/audit-modules.log && echo "PASS" || echo "FAIL")
          docs=$(grep -q "Nenhuma divergência" /tmp/docs-audit.log && echo "PASS" || echo "FAIL")
          {
            echo "## Resumo do CI — $(basename "$GITHUB_REF_NAME")"
            echo ""
            echo "| Checagem | Resultado |"
            echo "|---|---|"
            echo "| **tsc + build** | ✅ |"
            echo "| Testes | ${FILES} arquivos · **${TESTS}** testes |"
            echo "| Cobertura (stmts) | **${STMTS}%** |"
            echo "| audit:ui | **${ui}** |"
            echo "| audit:styles | **${styles}** |"
            echo "| audit:modules | **${modules}** |"
            echo "| docs:audit | **${docs}** |"
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: smoke-api (PostgreSQL isolado)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nxgest
          POSTGRES_USER: nxgest
          POSTGRES_PASSWORD: nxgest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nxgest -d nxgest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: |
          set -euo pipefail
          export DATABASE_URL=postgres://nxgest:nxgest@localhost:5432/nxgest
          # 1) schema isolado; 2) seed; 3) sobe UMA instância (rate limit ampliado) e roda o smoke
          npx tsx scripts/create-schema.mjs
          node scripts/seed-demo.mjs
          PORT=3002 LOGIN_RATE_LIMIT_MAX=10000 USER_RATE_LIMIT_MAX=100000 PUBLICO_RATE_LIMIT_MAX=100000 JWT_SECRET=ci-smoke-secret npx tsx src/main.ts &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 6
          node scripts/smoke-api.mjs --baseUrl http://127.0.0.1:3002

  migracao:
    name: migrate-modelo (schema + idempotência)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nxgest
          POSTGRES_USER: nxgest
          POSTGRES_PASSWORD: nxgest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nxgest -d nxgest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: |
          set -euo pipefail
          export DATABASE_URL=postgres://nxgest:nxgest@localhost:5432/nxgest
          # cria o schema do modelo atual e roda a migração idempotente sobre ele;
          # valida as invariantes do modelo (0 camelCase, timestamptz, numeric, FKs, índice parcial)
          npx tsx scripts/create-schema.mjs
          node scripts/migrate-modelo.mjs
          node scripts/valida-modelo.mjs

  deploy-staging:
    name: deploy-staging (homologação duckdns)
    runs-on: ubuntu-latest
    needs: [test, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Deploy no VPS (SSH)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/nxgestao || { echo "ERRO: /opt/nxgestao não encontrado no VPS"; exit 1; }
            bash scripts/deploy-staging.sh
