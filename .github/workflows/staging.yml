name: Staging verificado
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  attestations: write
  id-token: write
concurrency:
  group: nxgest-staging
  cancel-in-progress: false
jobs:
  staging:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.run_attempt == 1 && github.event.workflow_run.workflow_id == 330080640
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - name: Checkout do controlador aprovado
        uses: actions/checkout@v7
        with:
          ref: ${{ vars.CT011_CONTROLLER_SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Instala GH aprovado para verificar atestações
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tool_dir=$(mktemp -d "$RUNNER_TEMP/nxgest-gh.XXXXXXXX")
          trap 'rm -f -- "$tool_dir/gh.tar.gz" "$tool_dir/gh"; rmdir -- "$tool_dir"' EXIT
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 120 \
            https://github.com/cli/cli/releases/download/v2.103.3/gh_2.103.3_linux_amd64.tar.gz -o "$tool_dir/gh.tar.gz"
          printf '%s  %s\n' 4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d "$tool_dir/gh.tar.gz" | sha256sum --check --status
          tar -xOzf "$tool_dir/gh.tar.gz" gh_2.103.3_linux_amd64/bin/gh > "$tool_dir/gh"
          printf '%s  %s\n' b768184570b12536be4ac1528893f6340d1c6a7b40b56ad45bca9cd0e87ad34d "$tool_dir/gh" | sha256sum --check --status
          sudo install -m 0755 "$tool_dir/gh" /usr/bin/gh
          printf '%s  %s\n' b768184570b12536be4ac1528893f6340d1c6a7b40b56ad45bca9cd0e87ad34d /usr/bin/gh | sha256sum --check --status
          /usr/bin/gh --version
      - name: Verifica e materializa o artifact
        id: verified
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROLLED_POLICY: ${{ secrets.CT011_BUILD_POLICY }}
          POLICY_SHA256: ${{ vars.CT011_BUILD_POLICY_SHA256 }}
          POLICY_DECISION: ${{ vars.CT011_BUILD_POLICY_DECISION }}
          CI_RUN: ${{ github.event.workflow_run.id }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          CONTROLLER_SHA: ${{ vars.CT011_CONTROLLER_SHA }}
          STAGING_MODE: ${{ vars.CT011_STAGING_MODE }}
        run: |
          set -euo pipefail
          [[ "$CONTROLLER_SHA" =~ ^[a-f0-9]{40}$ && "$(git rev-parse HEAD)" == "$CONTROLLER_SHA" ]]
          umask 077
          mkdir -p .maestro/coord-qa/build-policies
          printf %s "$CONTROLLED_POLICY" > .maestro/coord-qa/build-policies/staging.json
          unset CONTROLLED_POLICY
          if [[ "${STAGING_MODE:-}" == staging-recurring-v2 ]]; then exit 0; fi
          node scripts/verify-build-artifact.mjs verify-event "$PWD/.maestro/coord-qa/build-policies/staging.json" "$POLICY_SHA256" "$POLICY_DECISION" "$CI_RUN" "$CI_SHA" > verified.json
          jq -e --arg run "$CI_RUN" --arg sha "$CI_SHA" '.verified == true and .fixture == false and .runId == $run and .attempt == 1 and .sourceSha == $sha' verified.json >/dev/null
          printf 'path=%s\n' "$(jq -er .imagePath verified.json)" >> "$GITHUB_OUTPUT"
          printf 'tar=%s\n' "$(jq -er .imageSha256 verified.json)" >> "$GITHUB_OUTPUT"
          printf 'zip=%s\n' "$(jq -er .zipSha256 verified.json)" >> "$GITHUB_OUTPUT"
          printf 'artifact=%s\n' "$(jq -er .artifactId verified.json)" >> "$GITHUB_OUTPUT"
      - name: Envia bytes e executa bootstrap sob lock
        if: ${{ vars.CT011_STAGING_MODE != 'staging-recurring-v2' }}
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN: ${{ github.event.workflow_run.id }}
          IMAGE_PATH: ${{ steps.verified.outputs.path }}
          TAR_DIGEST: ${{ steps.verified.outputs.tar }}
          ZIP_DIGEST: ${{ steps.verified.outputs.zip }}
          ARTIFACT_ID: ${{ steps.verified.outputs.artifact }}
          STAGING_MODE: ${{ vars.CT011_STAGING_MODE }}
          ADOPTION_POLICY_HASH: ${{ vars.CT011_ADOPTION_POLICY_SHA256 }}
          ADOPTION_DECISION: ${{ vars.CT011_ADOPTION_DECISION }}
          ADOPTION_HOST: ${{ vars.CT011_ADOPTION_HOST }}
          POST_POLICY_HASH: ${{ vars.CT011_POST_POLICY_SHA256 }}
          POST_DECISION: ${{ vars.CT011_POST_DECISION }}
          POST_HOST: ${{ vars.CT011_POST_HOST }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 ssh-private
          trap 'rm -f -- ssh-private/key ssh-private/known_hosts; rmdir ssh-private' EXIT
          printf '%s\n' "$VPS_KEY" > ssh-private/key
          cp infra/staging-known-hosts ssh-private/known_hosts
          unset VPS_KEY
          case "${STAGING_MODE:-staging}" in
            staging) adoption_args=(staging) ;;
            staging-adoption) adoption_args=(staging-adoption "$ADOPTION_POLICY_HASH" "$ADOPTION_DECISION" "$ADOPTION_HOST") ;;
            staging-post-baseline) adoption_args=(staging-post-baseline "$POST_POLICY_HASH" "$POST_DECISION" "$POST_HOST") ;;
            *) exit 1 ;;
          esac
          bash scripts/staging-transport.sh "$IMAGE_PATH" "$SOURCE_SHA" "$TAR_DIGEST" "$ZIP_DIGEST" "$CI_RUN" 1 "$ARTIFACT_ID" "$VPS_HOST" "$VPS_USER" "$PWD/ssh-private/key" "$PWD/ssh-private/known_hosts" "${adoption_args[@]}" > staging-remote.txt
          RECEIPT=$(grep '^STAGING_RECEIPT ' staging-remote.txt)
          [[ "$RECEIPT" =~ ^STAGING_RECEIPT\ sha=([a-f0-9]{40})\ run=([0-9]+)\ attempt=1\ artifact=([0-9]+)\ zip=(sha256:[a-f0-9]{64})\ tar=(sha256:[a-f0-9]{64})\ image=(sha256:[a-f0-9]{64})$ ]]
          [[ "${BASH_REMATCH[1]}" == "$SOURCE_SHA" && "${BASH_REMATCH[2]}" == "$CI_RUN" && "${BASH_REMATCH[3]}" == "$ARTIFACT_ID" && "${BASH_REMATCH[4]}" == "$ZIP_DIGEST" && "${BASH_REMATCH[5]}" == "$TAR_DIGEST" ]]
          IMAGE_ID=${BASH_REMATCH[6]}
          jq -n --arg sha "$SOURCE_SHA" --arg run "$CI_RUN" --arg artifact "$ARTIFACT_ID" --arg zip "$ZIP_DIGEST" --arg tar "$TAR_DIGEST" --arg image "$IMAGE_ID" --arg staging_run "$GITHUB_RUN_ID" --argjson staging_attempt "$GITHUB_RUN_ATTEMPT" '{version:"nxg-staging-v1",sha:$sha,ciRun:$run,ciAttempt:1,artifact:$artifact,zip:$zip,tar:$tar,image:$image,stagingRun:$staging_run,stagingAttempt:$staging_attempt,health:"ok",db:"connected"}' > staging-receipt.json
      - name: Verifica origem e envia pelo controlador recorrente
        if: ${{ vars.CT011_STAGING_MODE == 'staging-recurring-v2' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROLLER_SHA: ${{ vars.CT011_CONTROLLER_SHA }}
          BUILD_POLICY_PATH: ${{ github.workspace }}/.maestro/coord-qa/build-policies/staging.json
          BUILD_POLICY_HASH: ${{ vars.CT011_BUILD_POLICY_SHA256 }}
          BUILD_DECISION: ${{ vars.CT011_BUILD_POLICY_DECISION }}
          CI_RUN: ${{ github.event.workflow_run.id }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RECURRING_KEY: ${{ secrets.VPS_STAGING_RECURRING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 recurring-private
          trap 'rm -f -- recurring-private/key recurring-private/known_hosts; rmdir recurring-private' EXIT
          printf '%s\n' "$RECURRING_KEY" > recurring-private/key
          cp infra/staging-known-hosts recurring-private/known_hosts
          unset RECURRING_KEY
          export RECURRING_KEY_PATH="$PWD/recurring-private/key" RECURRING_KNOWN_HOSTS="$PWD/recurring-private/known_hosts"
          node scripts/recurring-runner.mjs staging
      - name: Atesta recibo do staging
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: staging-receipt.json
      - name: Publica recibo de staging
        uses: actions/upload-artifact@v7
        with:
          name: nxgest-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging-receipt.json
          if-no-files-found: error
          retention-days: 14
