name: CD
on:
  workflow_run:
    workflows: ["Staging verificado"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      staging_run:
        description: "ID exato do run de staging aprovado"
        required: true
        type: string
permissions:
  contents: read
  actions: read
  attestations: write
  id-token: write
concurrency:
  group: cd-prod
  cancel-in-progress: false
jobs:
  deploy-inicial:
    if: github.repository_id == '1304448439' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.run_attempt == 1 && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout do controlador aprovado
        uses: actions/checkout@v7
        with:
          ref: ${{ vars.CT011_CONTROLLER_SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Verifica staging atestado e artifact CI idêntico
        id: verified
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROLLER_SHA: ${{ vars.CT011_CONTROLLER_SHA }}
          STAGING_POLICY: ${{ secrets.CT011_STAGING_POLICY }}
          STAGING_POLICY_HASH: ${{ vars.CT011_STAGING_POLICY_SHA256 }}
          STAGING_DECISION: ${{ vars.CT011_STAGING_POLICY_DECISION }}
          BUILD_POLICY: ${{ secrets.CT011_BUILD_POLICY }}
          BUILD_POLICY_HASH: ${{ vars.CT011_BUILD_POLICY_SHA256 }}
          BUILD_DECISION: ${{ vars.CT011_BUILD_POLICY_DECISION }}
          STAGING_RUN: ${{ inputs.staging_run || github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          [[ "$CONTROLLER_SHA" =~ ^[a-f0-9]{40}$ && "$(git rev-parse HEAD)" == "$CONTROLLER_SHA" && "$STAGING_RUN" =~ ^[0-9]+$ ]]
          umask 077
          mkdir -p .maestro/coord-qa/build-policies
          printf %s "$STAGING_POLICY" > .maestro/coord-qa/build-policies/staging.json
          printf %s "$BUILD_POLICY" > .maestro/coord-qa/build-policies/build.json
          unset STAGING_POLICY BUILD_POLICY
          node scripts/verify-staging-receipt.mjs verify "$PWD/.maestro/coord-qa/build-policies/staging.json" "$STAGING_POLICY_HASH" "$STAGING_DECISION" "$STAGING_RUN" > staging-verified.json
          jq -e '.verified == true and .fixture == false' staging-verified.json >/dev/null
          CI_RUN=$(jq -er .ciRun staging-verified.json)
          SOURCE_SHA=$(jq -er .sha staging-verified.json)
          node scripts/verify-build-artifact.mjs verify-event "$PWD/.maestro/coord-qa/build-policies/build.json" "$BUILD_POLICY_HASH" "$BUILD_DECISION" "$CI_RUN" "$SOURCE_SHA" > build-verified.json
          jq -e --slurpfile stage staging-verified.json '.verified == true and .fixture == false and .runId == $stage[0].ciRun and .sourceSha == $stage[0].sha and .artifactId == $stage[0].artifact and .zipSha256 == $stage[0].zip and .imageSha256 == $stage[0].tar' build-verified.json >/dev/null
          printf 'path=%s\n' "$(jq -er .imagePath build-verified.json)" >> "$GITHUB_OUTPUT"
          for item in sha ciRun artifact zip tar image stagingRun; do printf '%s=%s\n' "$item" "$(jq -er --arg item "$item" '.[$item]' staging-verified.json)" >> "$GITHUB_OUTPUT"; done
      - name: Materializa primeira baseline sob lock
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          POLICY_HASH: ${{ vars.CT011_FIRST_POLICY_SHA256 }}
          IMAGE_PATH: ${{ steps.verified.outputs.path }}
          SOURCE_SHA: ${{ steps.verified.outputs.sha }}
          CI_RUN: ${{ steps.verified.outputs.ciRun }}
          ARTIFACT_ID: ${{ steps.verified.outputs.artifact }}
          ZIP_DIGEST: ${{ steps.verified.outputs.zip }}
          TAR_DIGEST: ${{ steps.verified.outputs.tar }}
          STAGING_IMAGE: ${{ steps.verified.outputs.image }}
          STAGING_RUN: ${{ steps.verified.outputs.stagingRun }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 ssh-private
          trap 'rm -f -- ssh-private/key ssh-private/known_hosts; rmdir ssh-private' EXIT
          printf '%s\n' "$VPS_KEY" > ssh-private/key
          cp infra/staging-known-hosts ssh-private/known_hosts
          unset VPS_KEY
          bash scripts/staging-transport.sh "$IMAGE_PATH" "$SOURCE_SHA" "$TAR_DIGEST" "$ZIP_DIGEST" "$CI_RUN" 1 "$ARTIFACT_ID" "$VPS_HOST" "$VPS_USER" "$PWD/ssh-private/key" "$PWD/ssh-private/known_hosts" production-initial "$STAGING_RUN" "$STAGING_IMAGE" "$POLICY_HASH" > production-remote.txt
          EXPECTED="PRODUCTION_BASELINE sha=$SOURCE_SHA tar=$TAR_DIGEST image=$STAGING_IMAGE"
          grep -Fx "$EXPECTED" production-remote.txt >/dev/null
          jq -n --arg sha "$SOURCE_SHA" --arg ci "$CI_RUN" --arg artifact "$ARTIFACT_ID" --arg zip "$ZIP_DIGEST" --arg tar "$TAR_DIGEST" --arg image "$STAGING_IMAGE" --arg staging "$STAGING_RUN" --arg run "$GITHUB_RUN_ID" '{version:"nxg-production-baseline-v1",sha:$sha,ciRun:$ci,artifact:$artifact,zip:$zip,tar:$tar,image:$image,stagingRun:$staging,productionRun:$run}' > production-receipt.json
      - name: Atesta recibo de produção
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: production-receipt.json
      - name: Publica recibo de produção
        uses: actions/upload-artifact@v7
        with:
          name: nxgest-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: production-receipt.json
          if-no-files-found: error
          retention-days: 14
