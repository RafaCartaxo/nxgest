version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    versioning-strategy: "auto"
    # Só minor/patch automático (majors exigem migração — Express 4→5, React 19, TS7,
    # Vite 8, Tailwind 4 quebraram o CI em 15/08). Migrações são tratadas por plano próprio.
    # update-types abaixo é a rede de segurança principal: majors nem criam PR.
    # O ignore é redundante (defensivo) — mantido para casos específicos.
    open-pull-requests-limit: 5
    groups:
      production-deps:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      dev-deps:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "express"
        versions: [">=6"]
      - dependency-name: "@types/express"
        versions: [">=6"]
      - dependency-name: "uuid"
        versions: [">=15"]
      - dependency-name: "react"
        versions: [">=19"]
      - dependency-name: "react-dom"
        versions: [">=19"]
      - dependency-name: "zod"
        versions: [">=4"]
      - dependency-name: "typescript"
        versions: [">=6"]
      - dependency-name: "vite"
        versions: [">=6"]
      - dependency-name: "tailwindcss"
        versions: [">=4"]
      - dependency-name: "@vitejs/plugin-react"
        versions: [">=5"]
      - dependency-name: "@vitejs/plugin-basic-ssl"
        versions: [">=2.2"]
      # drizzle-kit é 0.x — para 0.x, o gate minor/patch trata 0.24→0.31 como "minor"
      # (mas 0.x minor = breaking). Não usado no projeto (sem drizzle.config.ts,
      # migrações via raw SQL). Congelado em 0.24.x até haver migração deliberada.
      - dependency-name: "drizzle-kit"
        versions: [">=0.25"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    groups:
      actions:
        patterns: ["*"]
    labels:
      - "ci"
    commit-message:
      prefix: "chore(ci)"
