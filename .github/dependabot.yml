version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    versioning-strategy: "auto"
    # Só minor/patch automático (majors exigem migração — Express 4→5, React 19, TS7,
    # Vite 8, Tailwind 4 quebraram o CI em 15/08). Migrações são tratadas por plano próprio.
    ignore:
      - dependency-name: "express"
        versions: [">=6"]
      - dependency-name: "@types/express"
        versions: [">=6"]
      - dependency-name: "uuid"
        versions: [">=15"]
      - dependency-name: "react"
        versions: [">=19"]
      - dependency-name: "react-dom"
        versions: [">=19"]
      - dependency-name: "zod"
        versions: [">=4"]
      - dependency-name: "typescript"
        versions: [">=6"]
      - dependency-name: "vite"
        versions: [">=6"]
      - dependency-name: "tailwindcss"
        versions: [">=4"]
      - dependency-name: "@vitejs/plugin-react"
        versions: [">=5"]
      - dependency-name: "@vitejs/plugin-basic-ssl"
        versions: [">=2.2"]
      - dependency-name: "vitest"
        versions: [">=2"]
      - dependency-name: "@vitest/coverage-v8"
        versions: [">=2"]
      - dependency-name: "jsdom"
        versions: [">=27"]
      - dependency-name: "better-sqlite3"
        versions: [">=12"]
      - dependency-name: "drizzle-kit"
        versions: [">=1"]
      - dependency-name: "concurrently"
        versions: [">=10"]
      - dependency-name: "@testing-library/jest-dom"
        versions: [">=7"]
      - dependency-name: "@types/bcryptjs"
        versions: [">=3"]
    groups:
      production-deps:
        dependency-type: "production"
      dev-deps:
        dependency-type: "development"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    groups:
      actions:
        patterns: ["*"]
    labels:
      - "ci"
    commit-message:
      prefix: "chore(ci)"
