app = "nexus-platform"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/api/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"

[mounts]
  source = "nexus_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared-cpu-1x"
  cpus = 1
  memory_mb = 256
