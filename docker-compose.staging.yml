# Homologação (staging) — mesmo VPS da produção, stack/DB separados.
#
# - Domínio: https://nxgestao.duckdns.org (apontado pelo Caddy de produção)
# - Caddy único (docker-compose.prod.yml) encaminha duckdns → staging-app:8081
# - Volume próprio (nxgestao_staging_data) — produção intacta
# - Seed fake só na primeira vez (DB vazio) via deploy-staging.sh
services:
  staging-app:
    build: .
    container_name: staging-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8081
      # UPLOADS_DIR: pasta de uploads (banco usa DATABASE_URL).
      - UPLOADS_DIR=/data/uploads
      - DATABASE_URL=postgres://${PG_USER}:${PG_PASSWORD}@staging-pg:5432/${PG_DB}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL}
      - SUPER_ADMIN_DEFAULT_PASSWORD=${SUPER_ADMIN_DEFAULT_PASSWORD}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - APP_URL=${APP_URL}
      - MAIL_PROVIDER=${MAIL_PROVIDER}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - LOGIN_RATE_LIMIT_MAX=${LOGIN_RATE_LIMIT_MAX}
      - USER_RATE_LIMIT_MAX=${USER_RATE_LIMIT_MAX}
    volumes:
      - nxgestao_staging_data:/data
    expose:
      - "8081"
    networks:
      - shared
    depends_on:
      staging-pg:
        condition: service_healthy

  staging-pg:
    image: postgres:16-alpine
    container_name: staging-pg
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${PG_DB}
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
    volumes:
      - nxgestao_staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - shared

volumes:
  nxgestao_staging_data:
  nxgestao_staging_pgdata:

networks:
  shared:
    name: nxgestao_net
    external: true
