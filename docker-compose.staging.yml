# Homologação (staging) — mesmo VPS da produção, stack/DB separados.
#
# - Domínio: https://nxgestao.duckdns.org (apontado pelo Caddy de produção)
# - Caddy único (docker-compose.prod.yml) encaminha duckdns → staging-app:8081
# - Volume próprio (nxgestao_staging_data) — produção intacta
# - Seed fake só na primeira vez (DB vazio) via deploy-staging.sh
services:
  staging-app:
    build: .
    container_name: staging-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8081
      - DB_PATH=/data/gestao.db
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL}
      - SUPER_ADMIN_DEFAULT_PASSWORD=${SUPER_ADMIN_DEFAULT_PASSWORD}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - APP_URL=${APP_URL}
      - MAIL_PROVIDER=${MAIL_PROVIDER}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - LOGIN_RATE_LIMIT_MAX=${LOGIN_RATE_LIMIT_MAX}
      - USER_RATE_LIMIT_MAX=${USER_RATE_LIMIT_MAX}
    volumes:
      - nxgestao_staging_data:/data
    expose:
      - "8081"
    networks:
      - shared

volumes:
  nxgestao_staging_data:

networks:
  shared:
    name: nxgestao_net
    external: true
