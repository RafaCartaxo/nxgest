services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8080
      # DB_PATH mantido para derivar o diretório de uploads (uploads.ts); o banco usa DATABASE_URL.
      - DB_PATH=/data/gestao.db
      - DATABASE_URL=postgres://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_DB}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL}
      - SUPER_ADMIN_DEFAULT_PASSWORD=${SUPER_ADMIN_DEFAULT_PASSWORD}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - APP_URL=${APP_URL}
      - MAIL_PROVIDER=${MAIL_PROVIDER}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - LOGIN_RATE_LIMIT_MAX=${LOGIN_RATE_LIMIT_MAX}
      - USER_RATE_LIMIT_MAX=${USER_RATE_LIMIT_MAX}
    volumes:
      - nxgestao_data:/data
    expose:
      - "8080"
    networks:
      - shared
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: nxgest-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${PG_DB}
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
    volumes:
      - nxgestao_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - shared

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - shared

volumes:
  nxgestao_data:
  nxgestao_pgdata:
  caddy_data:
  caddy_config:

networks:
  shared:
    name: nxgestao_net
    external: true
